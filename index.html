<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spanish Soldier AR</title>
    <!-- Import Google Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #f0f0f0;
      }
      model-viewer {
        width: 100%;
        height: 100%;
      }
      /* Custom AR button styling */
      #ar-button {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 20px;
        padding: 12px 24px;
        font-family: sans-serif;
        font-size: 16px;
        font-weight: bold;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        cursor: pointer;
        z-index: 100;
      }
    </style>
  </head>
  <body>

    <!-- Model Viewer with Native AR Launch Support -->
    <model-viewer 
      src="./SpanishSoldier.glb" 
      alt="Spanish Military Model" 
      ar 
      ar-modes="webxr scene-viewer quick-look" 
      ar-scale="auto"
      camera-controls 
      touch-action="pan-y"
      shadow-intensity="1" 
      auto-rotate>
      
      <!-- Custom visible AR trigger button -->
      <button slot="ar-button" id="ar-button">
        👋 View in your space
      </button>

    </model-viewer>

  </body>
</html>
